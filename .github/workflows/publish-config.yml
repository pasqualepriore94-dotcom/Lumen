name: Pubblica configurazione app

# Quando il pannello web salva config/app-config.json, lo copia su Supabase Storage (pubblico),
# da dove l'app lo scarica all'avvio: il repository è privato.
on:
  push:
    branches: [main]
    paths: ["config/**", ".github/workflows/publish-config.yml"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Carica app-config.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          tools/inject_keys.py config/app-config.json app-config.public.json
          tools/publish_supabase.sh "app-config.json" app-config.public.json application/json
