name: Build iOS (IPA non firmata)

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Seleziona Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Genera il progetto Xcode
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compila (senza firma)
        working-directory: ios
        env:
          CONFIG_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/config/app-config.json
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            REMOTE_CONFIG_URL="$CONFIG_URL" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Lumen.app

      - name: Crea IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lumen.app Payload/
          zip -qry Lumen-unsigned.ipa Payload
          ls -lh Lumen-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-unsigned-ipa
          path: ios/Lumen-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log
