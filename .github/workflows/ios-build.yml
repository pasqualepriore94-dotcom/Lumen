name: Build iOS (IPA non firmata)

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Seleziona Xcode 26 (necessario per Liquid Glass)
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)"
          if [ -z "$XC" ]; then XC="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; fi
          echo "Uso $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Genera il progetto Xcode
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile') }}

      - name: Installa le librerie (VLC per MKV)
        working-directory: ios
        run: |
          which pod || sudo gem install cocoapods
          pod install --repo-update

      - name: Compila (senza firma)
        working-directory: ios
        env:
          CONFIG_URL: ${{ secrets.SUPABASE_PROJECT_REF && format('https://{0}.supabase.co/storage/v1/object/public/lumen/app-config.json', secrets.SUPABASE_PROJECT_REF) || '' }}
          FEED_URL: ${{ secrets.SUPABASE_PROJECT_REF && format('https://{0}.supabase.co/storage/v1/object/public/lumen/lumen-source.json', secrets.SUPABASE_PROJECT_REF) || '' }}
          AUTH_URL: ${{ vars.AUTH_SERVER_URL || (secrets.SUPABASE_PROJECT_REF && format('https://{0}.supabase.co/functions/v1/lumen-auth', secrets.SUPABASE_PROJECT_REF)) || '' }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Lumen.xcworkspace \
            -scheme Lumen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            REMOTE_CONFIG_URL="$CONFIG_URL" \
            AUTH_SERVER_URL="$AUTH_URL" \
            UPDATE_REPO="${{ github.repository }}" \
            UPDATE_FEED_URL="$FEED_URL" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || STATUS=$?
          # Mostra gli errori di compilazione direttamente nel riepilogo della build
          if grep -E "error:" build.log > errors.txt; then
            echo "## Errori di compilazione" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            sort -u errors.txt | head -60 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            sort -u errors.txt | head -60
          fi
          tail -5 build.log
          APP=build/Build/Products/Release-iphoneos/Lumen.app
          if [ "${STATUS:-0}" != "0" ] || [ ! -f "$APP/Lumen" ]; then
            echo "::error::Compilazione fallita: l'app non contiene l'eseguibile. Vedi gli errori sopra o l'artefatto build-log."
            exit 1
          fi

      - name: Crea IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lumen.app Payload/
          zip -qry Lumen-unsigned.ipa Payload
          ls -lh Lumen-unsigned.ipa

      - name: Pubblica l'IPA come release (link diretto per SideStore)
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          cp Lumen-unsigned.ipa Lumen.ipa
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}-build${{ github.run_number }}"
          # Sorgente per SideStore/AltStore: mostra "Aggiorna" quando esce una nuova build
          SIZE=$(stat -f%z Lumen.ipa)
          REPO="${{ github.repository }}"
          PUBLIC="https://$PROJECT_REF.supabase.co/storage/v1/object/public/lumen"
          cat > lumen-source.json <<JSON
          {
            "name": "Lumen",
            "identifier": "app.lumen.source",
            "subtitle": "Aggiornamenti di Lumen",
            "iconURL": "$PUBLIC/icon.png",
            "apps": [{
              "name": "Lumen",
              "bundleIdentifier": "app.lumen.beta",
              "developerName": "Pasquale Priore",
              "subtitle": "Film e serie TV",
              "localizedDescription": "Catalogo di film e serie in stile Liquid Glass.",
              "iconURL": "$PUBLIC/icon.png",
              "tintColor": "7C5CFF",
              "versions": [{
                "version": "$VERSION",
                "buildVersion": "${{ github.run_number }}",
                "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "localizedDescription": "Build ${{ github.run_number }}",
                "downloadURL": "$PUBLIC/releases/$TAG/Lumen.ipa",
                "size": $SIZE,
                "minOSVersion": "17.0"
              }],
              "appPermissions": {"entitlements": [], "privacy": {}}
            }],
            "news": []
          }
          JSON
          python3 -c "import json;json.load(open('lumen-source.json'))"
          gh release create "$TAG" Lumen.ipa lumen-source.json \
            --repo "${{ github.repository }}" \
            --title "Lumen ${VERSION} (build ${{ github.run_number }})" \
            --notes "IPA non firmata da installare con SideStore/AltStore. Link sempre aggiornato: https://github.com/${{ github.repository }}/releases/latest/download/Lumen.ipa" \
            --latest
          # File pubblici su Supabase Storage (il repository è privato)
          cp Lumen/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png icon.png
          ../tools/publish_supabase.sh \
            "releases/$TAG/Lumen.ipa" Lumen.ipa application/octet-stream \
            "Lumen.ipa" Lumen.ipa application/octet-stream \
            "icon.png" icon.png image/png \
            "lumen-source.json" lumen-source.json application/json \
            "app-config.json" ../config/app-config.json application/json
          echo "### IPA pronta" >> "$GITHUB_STEP_SUMMARY"
          echo "$PUBLIC/Lumen.ipa" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-unsigned-ipa
          path: ios/Lumen-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log
