name: Build iOS (IPA non firmata)

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Seleziona Xcode 26 (necessario per Liquid Glass)
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)"
          if [ -z "$XC" ]; then XC="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; fi
          echo "Uso $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Genera il progetto Xcode
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compila (senza firma)
        working-directory: ios
        env:
          CONFIG_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/config/app-config.json
          AUTH_URL: ${{ vars.AUTH_SERVER_URL || (secrets.SUPABASE_PROJECT_REF && format('https://{0}.supabase.co/functions/v1/lumen-auth', secrets.SUPABASE_PROJECT_REF)) || '' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            REMOTE_CONFIG_URL="$CONFIG_URL" \
            AUTH_SERVER_URL="$AUTH_URL" \
            UPDATE_REPO="${{ github.repository }}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || STATUS=$?
          # Mostra gli errori di compilazione direttamente nel riepilogo della build
          if grep -E "error:" build.log > errors.txt; then
            echo "## Errori di compilazione" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            sort -u errors.txt | head -60 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            sort -u errors.txt | head -60
          fi
          tail -5 build.log
          APP=build/Build/Products/Release-iphoneos/Lumen.app
          if [ "${STATUS:-0}" != "0" ] || [ ! -f "$APP/Lumen" ]; then
            echo "::error::Compilazione fallita: l'app non contiene l'eseguibile. Vedi gli errori sopra o l'artefatto build-log."
            exit 1
          fi

      - name: Crea IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lumen.app Payload/
          zip -qry Lumen-unsigned.ipa Payload
          ls -lh Lumen-unsigned.ipa

      - name: Pubblica l'IPA come release (link diretto per SideStore)
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Lumen-unsigned.ipa Lumen.ipa
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}-build${{ github.run_number }}"
          # Sorgente per SideStore/AltStore: mostra "Aggiorna" quando esce una nuova build
          SIZE=$(stat -f%z Lumen.ipa)
          REPO="${{ github.repository }}"
          cat > lumen-source.json <<JSON
          {
            "name": "Lumen",
            "identifier": "app.lumen.source",
            "subtitle": "Aggiornamenti di Lumen",
            "iconURL": "https://raw.githubusercontent.com/$REPO/main/ios/Lumen/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
            "apps": [{
              "name": "Lumen",
              "bundleIdentifier": "app.lumen.beta",
              "developerName": "Pasquale Priore",
              "subtitle": "Film e serie TV",
              "localizedDescription": "Catalogo di film e serie in stile Liquid Glass.",
              "iconURL": "https://raw.githubusercontent.com/$REPO/main/ios/Lumen/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
              "tintColor": "7C5CFF",
              "versions": [{
                "version": "$VERSION",
                "buildVersion": "${{ github.run_number }}",
                "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "localizedDescription": "Build ${{ github.run_number }}",
                "downloadURL": "https://github.com/$REPO/releases/download/$TAG/Lumen.ipa",
                "size": $SIZE,
                "minOSVersion": "17.0"
              }],
              "appPermissions": {"entitlements": [], "privacy": {}}
            }],
            "news": []
          }
          JSON
          python3 -c "import json;json.load(open('lumen-source.json'))"
          gh release create "$TAG" Lumen.ipa lumen-source.json \
            --repo "${{ github.repository }}" \
            --title "Lumen ${VERSION} (build ${{ github.run_number }})" \
            --notes "IPA non firmata da installare con SideStore/AltStore. Link sempre aggiornato: https://github.com/${{ github.repository }}/releases/latest/download/Lumen.ipa" \
            --latest
          # Copia la sorgente nel repository: SideStore la legge da raw.githubusercontent.com (JSON diretto, senza redirect)
          cd "$GITHUB_WORKSPACE"
          mkdir -p sidestore
          cp ios/lumen-source.json sidestore/lumen-source.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore/lumen-source.json
          git commit -m "Sorgente SideStore: $TAG [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}" || echo "::warning::Impossibile aggiornare sidestore/lumen-source.json"
          cd ios
          echo "### IPA pronta" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/latest/download/Lumen.ipa" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-unsigned-ipa
          path: ios/Lumen-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log
