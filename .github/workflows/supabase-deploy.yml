name: Pubblica server account (Supabase)

# Secret richiesti nel repository: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
# Secret della funzione (da impostare una volta su Supabase): JWT_SECRET, ADMIN_EMAIL, RESEND_API_KEY
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase-deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Controlla i secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Secret Supabase non impostati: salto la pubblicazione."; exit 0
          fi
      - name: Collega il progetto
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Crea/aggiorna la tabella utenti
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Pubblica la funzione lumen-auth
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy lumen-auth --no-verify-jwt --project-ref "$PROJECT_REF"
