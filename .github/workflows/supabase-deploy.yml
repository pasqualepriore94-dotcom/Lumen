name: Pubblica server account (Supabase)

# Secret del repository (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token personale Supabase (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   id del progetto (Project Settings → General → Reference ID)
#   SUPABASE_DB_PASSWORD   password del database scelta alla creazione del progetto
#   RESEND_API_KEY         (facoltativo) per le email di attivazione all'amministratore
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase-deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      LUMEN_JWT_SECRET: ${{ secrets.LUMEN_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Controlla i secret
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Secret Supabase non impostati: salto la pubblicazione."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Collega il progetto
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Crea/aggiorna le tabelle (utenti, abbinamenti TV)
        if: steps.check.outputs.ready == 'true'
        run: supabase db push --linked --yes -p "$SUPABASE_DB_PASSWORD" --include-all

      - name: Imposta i segreti della funzione
        if: steps.check.outputs.ready == 'true'
        run: |
          # JWT stabile: se non fornito, derivato dalla password del database (non cambia tra un deploy e l'altro).
          JWT="${LUMEN_JWT_SECRET:-$(printf '%s' "lumen-jwt:$SUPABASE_DB_PASSWORD:$PROJECT_REF" | sha256sum | cut -d' ' -f1)}"
          ARGS=("JWT_SECRET=$JWT" "ADMIN_EMAIL=pasquale.priore94@gmail.com" "APP_NAME=Lumen")
          if [ -n "$RESEND_API_KEY" ]; then ARGS+=("RESEND_API_KEY=$RESEND_API_KEY"); else echo "::warning::RESEND_API_KEY assente: le email di attivazione non partiranno (gli utenti si attivano comunque dall'app)."; fi
          supabase secrets set --yes --project-ref "$PROJECT_REF" "${ARGS[@]}"

      - name: Pubblica la funzione lumen-auth
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy lumen-auth --yes --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Verifica
        if: steps.check.outputs.ready == 'true'
        run: |
          URL="https://$PROJECT_REF.supabase.co/functions/v1/lumen-auth"
          sleep 5
          curl -sS "$URL/health"; echo
          # Niente login di prova: conterebbe come tentativo errato e potrebbe bloccare l'account admin.
          echo "### Server account attivo" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: \`$URL\`" >> "$GITHUB_STEP_SUMMARY"
