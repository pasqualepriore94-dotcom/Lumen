name: Lumen
options:
  bundleIdPrefix: app.lumen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: it

settings:
  base:
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Viene impostato dal workflow GitHub con l'URL raw di config/app-config.json
    REMOTE_CONFIG_URL: ""
    # URL della funzione Supabase lumen-auth (variabile AUTH_SERVER_URL del repository GitHub)
    AUTH_SERVER_URL: ""

targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumen.beta
        PRODUCT_NAME: Lumen
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        RemoteConfigURL: $(REMOTE_CONFIG_URL)
        AuthServerURL: $(AUTH_SERVER_URL)
